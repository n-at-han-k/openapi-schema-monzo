# The document is linted, the suite is regenerated from it and run, and the gem
# is built. Without MONZO_TOKEN every example skips, which still proves the
# document loads, its refs resolve and the specs match the document; add
# MONZO_TOKEN as a repository secret to have it talk to Monzo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Lint the document
        run: nix develop --command vacuum lint -d monzo_api.yaml --fail-severity error
      - name: spec/api is what the document generates
        run: |
          nix develop --command bin/generate-specs
          git diff --exit-code -- spec/api

  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
        env:
          MONZO_TOKEN: ${{ secrets.MONZO_TOKEN }}
      - run: gem build monzo.gemspec
