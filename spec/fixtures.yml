# The values this suite reads. It talks to a REAL Monzo account, so nothing is
# invented: an id here is one you are content for a request to touch.
#
# A path parameter or a required query argument with no value here skips its
# examples rather than guessing -- a 400 that passes because 400 is documented
# proves nothing.
#
# Fill in your own ids. `MONZO_TOKEN=... bundle exec rspec` with the file as it
# stands checks /accounts and /ping/whoami and skips the rest.
