.ruby: &ruby
  variables:
    LANG: "C.UTF-8"
  before_script:
    - ruby -v
    - bundle config set --local deployment true
    - bundle install -j $(nproc)
  parallel:
    matrix:
      - RUBY_VERSION: ['3.0', '3.1', '3.2']
  image: "ruby:$RUBY_VERSION"
  cache:
    paths:
      - vendor/ruby
    key: 'ruby-$RUBY_VERSION'

# Without MONZO_TOKEN every example skips, which still proves the document
# loads, its refs resolve and the suite runs. Set MONZO_TOKEN as a masked CI
# variable to have it actually talk to Monzo.
gem:
  extends: .ruby
  script:
    - bundle exec rspec
    - bundle exec rake build
    - bundle exec rake install
  artifacts:
    paths:
      - pkg/*.gem
